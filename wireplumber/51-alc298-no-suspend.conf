## Keep the ALC298 analog sink awake.
##
## The Galaxy Book 10.6's codec output stage is configured by
## galaxybook-audio-init (COEF writes). Letting WirePlumber suspend the ALSA
## node powers that stage back down, so audio dies after a few seconds idle
## and does not come back. Disabling suspend for this node avoids that.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.*" }
      { node.name = "~alsa_input.pci-0000_00_1f.3.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
